name: Scrapear resultados Quini 6

on:
  schedule:
    # Los sorteos son miércoles y domingo 21:15 hs Argentina (UTC-3) = 00:15 UTC.
    # Uso minutos "no redondos" (07, 22, 37, 52) porque GitHub prioriza los
    # cron jobs en punto (:00, :15, :30, :45) -son los más usados en todo el
    # mundo- y en horas de mucha carga global puede saltear directamente los
    # que caen justo ahí. Cubro 2 horas después del sorteo por las dudas.
    - cron: "7,22,37,52 1 * * 4"
    - cron: "7,22,37,52 1 * * 1"
    - cron: "0 3 * * 4"
    # Corrida diaria de respaldo por si el sitio publica fuera de horario
    # o hubo algún corte el día del sorteo.
    - cron: "13 12 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Correr scraper
        run: python scraper.py

      - name: Commitear data.json si cambió
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: actualizar resultados Quini 6"
          file_pattern: "data/latest.json"
