name: Scrapear resultados Quini 6

on:
  schedule:
    # El disparo preciso ahora lo hace cron-job.org pegándole a la API con
    # workflow_dispatch (más confiable que el schedule interno de GitHub,
    # que puede demorarse varias horas, a veces hasta la madrugada). Esto
    # que queda acá es solo un respaldo diario por si cron-job.org falla.

    # Backup diario 09:13 hs ART = 12:13 UTC, por si se publica tarde o falló algo.
    - cron: "13 12 * * *"

  workflow_dispatch:

env:
  # Esto SÍ tiene efecto (a diferencia de CRON_TZ): hace que el runner
  # tenga la hora local de Argentina DURANTE la ejecución del job, útil si
  # el scraper llegara a usar la hora local del sistema. No afecta en nada
  # el horario de disparo del "schedule" de arriba (ese siempre es UTC).
  TZ: America/Argentina/Buenos_Aires

concurrency:
  group: scrape-quini-6
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-auth

      - name: Correr scraper
        id: scrape
        run: python scraper.py

      - name: Commitear data/latest.json si cambió
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: actualizar resultados Quini 6"
          file_pattern: "data/latest.json"

      - name: Enviar notificación push (solo si hay sorteo nuevo)
        if: steps.scrape.outputs.nuevo_sorteo != ''
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          NUEVO_SORTEO: ${{ steps.scrape.outputs.nuevo_sorteo }}
        run: python notify_fcm.py
