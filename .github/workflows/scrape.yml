name: Scrapear resultados Quini 6

on:
  schedule:
    # Sorteos: domingo y miércoles 21:15 ART.
    # Primeros intentos: 21:22, 21:37 y 21:52 ART.
    - cron: "22,37,52 21 * * 0,3"

    # Segunda hora de intentos: 22:07, 22:22, 22:37 y 22:52 ART.
    - cron: "7,22,37,52 22 * * 0,3"

    # Último intento nocturno: 23:22 ART, ~2 horas después del sorteo.
    - cron: "22 23 * * 0,3"

    # Backup diario por si el resultado se publica tarde o falló algo.
    - cron: "13 9 * * *"

  workflow_dispatch:

env:
  # GitHub interpreta los cron en hora argentina.
  CRON_TZ: America/Argentina/Buenos_Aires

  # El runner queda en hora argentina, útil si el scraper usa fechas locales.
  TZ: America/Argentina/Buenos_Aires

concurrency:
  group: scrape-quini-6
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Correr scraper
        run: python scraper.py

      - name: Commitear data/latest.json si cambió
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: actualizar resultados Quini 6"
          file_pattern: "data/latest.json"
